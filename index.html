<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brotito Vocacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --ink:#2A2433; --paper:#FFFDF9; --panel:#FFFDF9; --soft:#6E6478; --line:rgba(123,92,196,.28);
  --leaf:#6FA35A; --leaf2:#8CC26F; --blush:#F4A6B8; --earth:#8A6A4F;
  --accent:#7B5CC4; --accent-ink:#fff; --tint:rgba(123,92,196,.12);
  --R:#E0874F; --I:#4C8DD6; --A:#C760B5; --S:#4FAE7A; --E:#E5B437; --C:#7A7F96;
  --display:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#241E34;--paper:#241E34;--ink:#F3EEFA;--soft:#B9AECB;--accent:#A88BF0;--accent-ink:#1E1830;--line:rgba(168,139,240,.35);--tint:rgba(168,139,240,.16)}}
:root[data-theme="dark"]{--panel:#241E34;--paper:#241E34;--ink:#F3EEFA;--soft:#B9AECB;--accent:#A88BF0;--accent-ink:#1E1830;--line:rgba(168,139,240,.35);--tint:rgba(168,139,240,.16)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--panel)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #FFD66B;outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--panel)}

#stage{position:relative;height:clamp(230px,36vh,320px);background:linear-gradient(#7EC4F0 0%,#B8E1F7 60%,#EAF6EC 100%);overflow:hidden;flex-shrink:0}
#hill{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:30%}
#chars{position:absolute;left:0;bottom:6%;width:46%;height:72%}
#bubble{position:absolute;right:12px;top:14px;left:42%;background:#fff;color:#2A2433;border:2.5px solid #2A2433;border-radius:20px;padding:10px 12px;font-size:15px;line-height:1.4;font-weight:600;box-shadow:0 4px 0 rgba(42,36,51,.18);max-height:72%;overflow:auto}
#bubble::after{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right-color:#2A2433}
#bubble::before{content:"";position:absolute;left:-7px;bottom:24px;border:8px solid transparent;border-right-color:#fff;z-index:1}
#topchips{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.chip{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;color:#2A2433}
#voiceBtn{position:absolute;left:12px;bottom:10px;z-index:3}
.breath{animation:breath 3.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes breath{50%{transform:scaleY(1.025)}}
.eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes sway{50%{transform:rotate(6deg)}}
.grow{animation:grow .7s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 100%;transform-box:fill-box}
@keyframes grow{from{transform:scale(0)}}
.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-10px)}}

#progress{height:6px;background:var(--tint)}
#bar{height:100%;width:0;background:var(--leaf);transition:width .4s ease}
#panel{flex:1;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--display);line-height:1.15;margin:0 0 6px}
h1{font-size:30px} h2{font-size:24px}
.sub{color:var(--soft);margin:0 0 16px;line-height:1.5}
.q{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.25;margin:4px 0 16px;min-height:58px}
.qnum{color:var(--soft);font-weight:700;font-size:13px}
.btn{width:100%;border:0;border-radius:16px;padding:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:19px}
.btn[disabled]{opacity:.45}
.link{border:0;background:none;color:var(--soft);font-weight:700;padding:10px;width:100%}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);margin-bottom:14px}
.opts{display:grid;gap:8px;margin-bottom:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px 12px;text-align:left;font-weight:700;font-size:15px;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale{display:grid;gap:8px}
.scale .opt{display:flex;align-items:center;gap:12px;font-size:17px;padding:14px}
.dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:11px;background:transparent;font-weight:700;width:100%;margin-top:10px}
.mic.on{border-style:solid;background:var(--tint)}
.hidden{display:none!important}
.note{font-size:13px;color:var(--soft);line-height:1.45}

/* informe */
.code{display:flex;gap:8px;margin:10px 0 18px}
.letter{flex:1;border-radius:16px;padding:10px 6px;text-align:center;color:#fff;font-family:var(--display)}
.letter b{display:block;font-size:34px;line-height:1}
.letter span{font-size:13px;font-weight:700}
.bars{margin:6px 0 20px}
.brow{display:grid;grid-template-columns:92px 1fr 38px;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:700}
.track{height:12px;border-radius:99px;background:var(--tint);overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sec{margin:22px 0 0}
.sec h3{font-family:var(--display);font-size:20px;margin:0 0 6px}
.sec p{margin:0 0 8px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.tag{border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:600}
.warn{margin-top:22px;padding:12px 14px;border-radius:14px;background:var(--tint);font-size:14px;line-height:1.5}
.actions{display:grid;gap:8px;margin-top:20px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:12px;font-weight:700}
.sponsor{margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;text-align:left}
.sponsor img{height:64px;width:auto;max-width:110px;object-fit:contain;flex-shrink:0}
.sponsor b{display:block;font-family:var(--display);font-size:19px;line-height:1.15}
.sponsor a{display:inline-block;color:var(--accent);font-weight:700;font-size:16px;text-decoration:none}
@media print{#stage,#progress,.actions,.noprint{display:none!important} body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="topchips"><span class="chip" id="stepChip">Hola</span></div>
    <svg id="hill" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 50 Q200 0 400 50 L400 100 L0 100Z" fill="var(--earth)"/>
      <path d="M0 50 Q200 0 400 50" fill="none" stroke="var(--leaf)" stroke-width="7" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg id="chars" viewBox="90 60 220 250" preserveAspectRatio="xMidYMax meet">
      <g id="brotito">
        <g class="breath">
          <g class="sway">
            <path d="M200 118 Q198 96 204 80" stroke="var(--leaf)" stroke-width="5" fill="none" stroke-linecap="round"/>
            <g id="leaves"></g>
          </g>
          <path d="M200 116 C258 116 284 170 284 214 C284 262 248 292 200 292 C152 292 116 262 116 214 C116 170 142 116 200 116Z" fill="#FFFDF7" stroke="#2A2433" stroke-width="5"/>
          <path d="M150 150 Q160 132 182 126" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".9"/>
          <g class="eye"><ellipse cx="172" cy="200" rx="15" ry="18" fill="#2A2433"/><circle cx="177" cy="193" r="5.5" fill="#fff"/><circle cx="167" cy="207" r="2.5" fill="#fff"/></g>
          <g class="eye"><ellipse cx="228" cy="200" rx="15" ry="18" fill="#2A2433"/><circle cx="233" cy="193" r="5.5" fill="#fff"/><circle cx="223" cy="207" r="2.5" fill="#fff"/></g>
          <ellipse cx="150" cy="228" rx="14" ry="8" fill="var(--blush)" opacity=".8"/>
          <ellipse cx="250" cy="228" rx="14" ry="8" fill="var(--blush)" opacity=".8"/>
          <path id="mouthC" d="M190 232 Q200 242 210 232" stroke="#2A2433" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <ellipse id="mouthO" cx="200" cy="237" rx="8" ry="9" fill="#5A2E3E" stroke="#2A2433" stroke-width="3.5" class="hidden"/>
          <path d="M126 236 Q104 246 108 262" stroke="#2A2433" stroke-width="5" fill="#FFFDF7" stroke-linecap="round"/>
          <path d="M274 236 Q296 246 292 262" stroke="#2A2433" stroke-width="5" fill="#FFFDF7" stroke-linecap="round"/>
          <ellipse cx="172" cy="294" rx="20" ry="10" fill="#FFFDF7" stroke="#2A2433" stroke-width="5"/>
          <ellipse cx="228" cy="294" rx="20" ry="10" fill="#FFFDF7" stroke="#2A2433" stroke-width="5"/>
        </g>
      </g>
    </svg>
    <div id="bubble" aria-live="polite">¡Hola! Soy Brotito.</div>
    <button class="chip" id="voiceBtn" aria-label="Activar o silenciar la voz">🔊 Voz</button>
  </div>
  <div id="progress"><div id="bar"></div></div>
  <main id="panel"></main>
</div>

<script>
// ================= CONTENIDO =================
const TYPES = {
  R:{n:"Realista",c:"var(--R)",short:"Hacer con las manos",
     d:"Te gusta ver el resultado concreto de lo que hacés: arreglar, armar, construir, trabajar con herramientas, máquinas o al aire libre.",
     car:[["Mecánica automotriz","c"],["Electricidad domiciliaria e industrial","c"],["Soldadura","c"],["Tecnicatura en electromecánica","t"],["Maestro mayor de obras","t"],["Ingeniería electromecánica","u"],["Ingeniería forestal","u"],["Agronomía","u"]]},
  I:{n:"Investigador",c:"var(--I)",short:"Entender cómo funciona",
     d:"Te atrae entender el porqué de las cosas: investigar, analizar, resolver problemas difíciles y aprender sobre ciencia o tecnología.",
     car:[["Curso de programación","c"],["Tecnicatura en programación","t"],["Técnico de laboratorio","t"],["Licenciatura en sistemas","u"],["Medicina","u"],["Bioquímica","u"],["Biología","u"],["Física o Química","u"]]},
  A:{n:"Artístico",c:"var(--A)",short:"Crear y expresar",
     d:"Disfrutás crear algo propio y expresarte: dibujar, escribir, diseñar, actuar, hacer música, fotos o videos.",
     car:[["Diseño gráfico o edición de video","c"],["Fotografía","c"],["Tecnicatura en diseño gráfico","t"],["Producción audiovisual","t"],["Arquitectura","u"],["Diseño industrial","u"],["Música","u"],["Letras","u"]]},
  S:{n:"Social",c:"var(--S)",short:"Ayudar y acompañar",
     d:"Te sale naturalmente ayudar, enseñar, escuchar y cuidar a otras personas. Te importa que a los demás les vaya bien.",
     car:[["Auxiliar de enfermería o cuidador","c"],["Instructor deportivo","c"],["Enfermería","t"],["Profesorado","t"],["Psicología","u"],["Trabajo social","u"],["Kinesiología","u"],["Psicopedagogía","u"]]},
  E:{n:"Emprendedor",c:"var(--E)",short:"Liderar y convencer",
     d:"Te gusta tomar la iniciativa, convencer, vender ideas, liderar grupos y animarte a armar algo propio.",
     car:[["Ventas y atención al cliente","c"],["Emprendimiento propio","c"],["Tecnicatura en marketing","t"],["Guía de turismo","t"],["Administración de empresas","u"],["Abogacía","u"],["Comercio exterior","u"],["Ciencia política","u"]]},
  C:{n:"Organizador",c:"var(--C)",short:"Ordenar y planificar",
     d:"Te sentís cómodo con el orden, los datos y los procesos claros: que todo cierre, que esté prolijo y bien organizado.",
     car:[["Auxiliar administrativo","c"],["Liquidación de sueldos","c"],["Tecnicatura en administración","t"],["Tecnicatura en logística","t"],["Bibliotecología","t"],["Contador público","u"],["Recursos humanos","u"],["Escribanía","u"]]}
};
const PAIRS = {
  RI:["Ingeniería electrónica o mecatrónica","Técnico de laboratorio","Robótica y automatización"],
  RA:["Arquitectura","Diseño industrial","Carpintería y diseño de muebles"],
  RS:["Educación física","Kinesiología","Guardaparque o bombero"],
  RE:["Ingeniería industrial","Emprendimiento técnico propio (taller, servicio)"],
  RC:["Higiene y seguridad","Agrimensura","Logística"],
  IA:["Diseño de videojuegos","Diseño UX","Arquitectura"],
  IS:["Medicina","Psicología","Nutrición"],
  IE:["Economía","Sistemas con orientación a gestión"],
  IC:["Ciencia de datos","Bioquímica","Actuario"],
  AS:["Musicoterapia","Profesorado de arte","Comunicación social"],
  AE:["Publicidad","Producción audiovisual","Marketing digital"],
  AC:["Diseño editorial","Dibujo técnico y diseño de interiores"],
  SE:["Abogacía","Recursos humanos","Turismo"],
  SC:["Administración pública","Enfermería","Gestión escolar"],
  EC:["Contador público","Administración de empresas","Comercio exterior"]
};
const ITEMS = [
 ["R","Arreglar una bici, una moto o un aparato que no anda"],
 ["I","Hacer experimentos para descubrir por qué pasa algo"],
 ["A","Dibujar, pintar o diseñar algo"],
 ["S","Explicarle a un compañero algo que no entiende"],
 ["E","Vender algo y convencer a la gente de que lo compre"],
 ["C","Llevar las cuentas de un negocio"],
 ["R","Armar un circuito o hacer una instalación eléctrica"],
 ["I","Resolver un problema de matemática o de lógica difícil"],
 ["A","Escribir historias, poemas o canciones"],
 ["S","Cuidar a alguien que está enfermo"],
 ["E","Armar tu propio emprendimiento"],
 ["C","Ordenar datos en una planilla para que todo quede prolijo"],
 ["R","Trabajar al aire libre, en el campo o en el monte"],
 ["I","Investigar cómo funciona el cuerpo humano"],
 ["A","Actuar, cantar o tocar un instrumento"],
 ["S","Escuchar a un amigo que tiene un problema y ayudarlo"],
 ["E","Liderar un grupo y tomar las decisiones"],
 ["C","Seguir un procedimiento paso a paso sin saltearte nada"],
 ["R","Manejar máquinas o herramientas"],
 ["I","Programar una app y buscar por qué falla"],
 ["A","Sacar fotos o editar videos"],
 ["S","Organizar una actividad solidaria"],
 ["E","Hablar en público o presentar una idea"],
 ["C","Controlar un stock o un inventario"],
 ["R","Construir un mueble o algo de madera"],
 ["I","Leer sobre el espacio, la naturaleza o la ciencia"],
 ["A","Decorar un lugar o armar tu ropa con estilo propio"],
 ["S","Trabajar con chicos"],
 ["E","Negociar un precio o un acuerdo"],
 ["C","Organizar horarios, agendas o turnos"]
];
const SCALE = [
  {v:3,t:"¡Me encanta!",e:"😍",k:["encanta","re","mucho","muchísimo","sí sí"]},
  {v:2,t:"Me gusta",e:"🙂",k:["gusta","sí","si","bastante"]},
  {v:1,t:"Me da igual",e:"😐",k:["igual","más o menos","mas o menos","maso","no sé","no se","capaz"]},
  {v:0,t:"No me gusta",e:"🙅",k:["no"]}
];
const VALORES = ["Ayudar a los demás","Ganar bien","Tener estabilidad","Crear cosas nuevas","Libertad de horarios","Contacto con la naturaleza","Aprender siempre","Que me reconozcan"];
const MATERIAS = ["Matemática","Lengua","Biología","Física o Química","Historia o Geografía","Arte o Música","Educación Física","Informática o Taller","Inglés"];
const HOBBIES = [
  ["Videojuegos","IA"],["Hacer deporte","RS"],["Dibujar o hacer música","A"],["Arreglar o armar cosas","R"],
  ["Leer","IA"],["Crear contenido en redes","AE"],["Ayudar o hacer voluntariado","S"],["Estar en el campo o con animales","RI"],
  ["Cocinar","RA"],["Vender o hacer negocios","E"],["Usar la compu o programar","IC"],["Ordenar, coleccionar, planificar","C"]];
const PLAN = [["estudiar","Seguir estudiando"],["trabajar","Salir a trabajar"],["ambas","Estudiar y trabajar"],["nose","Todavía no sé"]];
const DUR = [["c","Algo corto: un curso u oficio (meses a 1 año)"],["t","Un terciario o tecnicatura (2 a 3 años)"],["u","Una carrera universitaria (4 a 6 años)"],["x","No sé, quiero ver opciones"]];
const LUGAR = [["cerca","Quedarme en mi zona"],["mudar","Me podría mudar a otra ciudad"],["virtual","Prefiero estudiar a distancia"],["x","No lo pensé todavía"]];
const NIVEL = {c:"Curso u oficio",t:"Terciario",u:"Universidad"};
const SITUACION = ["Estoy en el secundario","Terminé el secundario","Estoy estudiando otra carrera","Estoy trabajando"];
const REACT = {
  3:["¡Uh, eso te encanta!","¡Mirá vos, qué lindo!","¡Anotado con estrellita!"],
  2:["Bien, anotado.","Ajá, te gusta.","Buenísimo."],
  1:["Ok, ni fu ni fa.","Anotado.","Tranqui, vale también."],
  0:["Anotado, eso no es lo tuyo.","Perfecto, eso lo descartamos.","Está bien, no todo nos tiene que gustar."]
};
const pick = a=>a[Math.floor(Math.random()*a.length)];

// ================= ESTADO =================
const $ = s=>document.querySelector(s);
const P = $("#panel");
const BLANK=()=>({name:"",edad:"",situacion:"",materias:[],hobbies:[],plan:"",dur:"",lugar:"",answers:[],valores:[]});
let S = BLANK();
// Pie de portada (logo e Instagram). Dejar vacío para no mostrarlo.
const FOOTER = { logo:"logo-municipalidad.png", nombre:"Municipalidad de Eldorado", ig:"poloeducativo.eldorado" };
try{ const saved=JSON.parse(localStorage.getItem("brotito-voc")||"null"); if(saved) S=saved; }catch(e){}
const save=()=>{ try{localStorage.setItem("brotito-voc",JSON.stringify(S));}catch(e){} };

// ================= VOZ =================
const HAS_TTS = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
let voice=null, voiceOn=true, mouthT=null, lastText="", speakGen=0, keepAlive=null;
function pickVoice(){ if(!HAS_TTS)return; const vs=speechSynthesis.getVoices(); if(!vs.length)return;
  for(const p of ["es-AR","es-419","es-US","es-MX","es-ES"]){const v=vs.find(v=>v.lang.replace("_","-")===p); if(v){voice=v;return;}}
  voice=vs.find(v=>v.lang.toLowerCase().startsWith("es"))||null; }
if(HAS_TTS){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function mouth(open){ $("#mouthO").classList.toggle("hidden",!open); $("#mouthC").classList.toggle("hidden",open); }
function talkAnim(ms){
  clearInterval(mouthT); let open=false; const end=Date.now()+ms;
  mouthT=setInterval(()=>{ if(Date.now()>=end){ clearInterval(mouthT); mouth(false); return; } open=!open; mouth(open); },170);
}
function stopTalk(){ clearInterval(mouthT); clearInterval(keepAlive); mouth(false); }
function voiceLabel(){ $("#voiceBtn").textContent = !HAS_TTS ? "🔇 Sin voz" : voiceOn ? "🔊 Voz" : "🔇 Silencio"; }
// El primer toque "despierta" la voz (Chrome en Android lo necesita)
let unlocked=false;
function unlock(){ if(unlocked||!HAS_TTS) return; unlocked=true; try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
document.addEventListener("pointerdown",unlock,{once:true});
function say(text){
  lastText=text;
  $("#bubble").textContent=text;
  const est=Math.min(12000,600+text.split(/\s+/).length*330);
  if(!voiceOn||!HAS_TTS){ talkAnim(Math.min(est,2500)); return; }
  const gen=++speakGen;
  try{ speechSynthesis.cancel(); }catch(e){}
  // frases cortas: Chrome corta las lecturas largas
  const parts=text.replace(/[😍🙂😐🙅🌱🎙️]/g,"").match(/[^.!?¿¡]+[.!?]*|[¿¡][^?!]+[?!]/g)||[text];
  // pequeña pausa después de cancel(): si no, Android a veces se traga lo siguiente
  setTimeout(()=>{
    if(gen!==speakGen) return;
    talkAnim(est);
    parts.map(t=>t.trim()).filter(Boolean).forEach((t,i,arr)=>{
      const u=new SpeechSynthesisUtterance(t);
      u.lang=voice?voice.lang:"es-AR"; if(voice)u.voice=voice; u.rate=.95; u.pitch=1.3;
      if(i===arr.length-1) u.onend=()=>{ if(gen===speakGen) stopTalk(); };
      u.onerror=()=>{ if(gen===speakGen) stopTalk(); };
      try{ speechSynthesis.speak(u); }catch(e){}
    });
    // Chrome a veces "se duerme" a mitad de una lectura: lo despertamos
    clearInterval(keepAlive);
    keepAlive=setInterval(()=>{ if(!speechSynthesis.speaking){ clearInterval(keepAlive); return; } try{ speechSynthesis.resume(); }catch(e){} },4000);
  },120);
}
function shutUp(){ speakGen++; try{ speechSynthesis.cancel(); }catch(e){} stopTalk(); }
$("#voiceBtn").onclick=()=>{
  if(!HAS_TTS){ $("#bubble").textContent="Este navegador no tiene voz, pero podés leer todo lo que te digo acá."; return; }

// ================= MICRÓFONO (opcional) =================
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function listen(onText, btn){
  if(!SR) return;
  if(rec){ try{ rec.abort(); }catch(e){} return; }   // segundo toque: cancelar
  shutUp();
  const label=t=>{ const s=btn.querySelector("span"); if(s) s.textContent=t; };
  let got=false, done=false, timer=null;
  const finish=msg=>{
    if(done) return; done=true; clearTimeout(timer); rec=null;
    btn.classList.remove("on"); label("Responder hablando");
    if(msg) $("#bubble").textContent=msg;
  };
  const r=new SR(); rec=r;
  r.lang="es-AR"; r.interimResults=true; r.maxAlternatives=3; r.continuous=false;
  btn.classList.add("on"); label("Te escucho… (tocá para cancelar)");
  $("#bubble").textContent="Te escucho… 👂";
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    $("#bubble").textContent="“"+res[0].transcript+"”";
    if(res.isFinal && !got){ got=true; finish(); onText([...res].map(a=>a.transcript.toLowerCase())); }
  };
  r.onerror=e=>{
    const m={ "not-allowed":"No tengo permiso para usar el micrófono. Podés tocar las opciones, que es igual de rápido.",
              "service-not-allowed":"Este navegador no me deja usar el micrófono. Tocá las opciones nomás.",
              "no-speech":"No te escuché. Probá de nuevo hablando un poco más fuerte, o tocá una opción.",
              "audio-capture":"No encuentro el micrófono del dispositivo. Tocá una opción.",
              "network":"Para entender tu voz necesito internet. Tocá una opción y seguimos.",
              "aborted":"" }[e.error];
    if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){ micBroken=true; btn.remove(); }
    finish(m===undefined?"No te pude escuchar. Tocá una opción y seguimos.":m);
  };
  r.onend=()=>finish(got?"":"No te escuché. Probá de nuevo o tocá una opción.");
  timer=setTimeout(()=>{ try{ r.stop(); }catch(e){} setTimeout(()=>finish("No te escuché. Probá de nuevo o tocá una opción."),1200); },9000);
  setTimeout(()=>{ try{ r.start(); }catch(e){ finish("No pude activar el micrófono. Tocá una opción."); } },250);
}
function matchScale(t){
  const W=w=>new RegExp("(^|[^a-záéíóúñü])("+w+")(?=$|[^a-záéíóúñü])");
  const rules=[[1,W("me da igual|da igual|igual|m[aá]s o menos|maso|no s[eé]|capaz|ni fu ni fa")],
               [0,W("no me gusta|no me encanta|para nada|odio|nada|no")],
               [3,W("me encanta|encanta|me fascina|mucho|much[ií]simo|re s[ií]|me re gusta")],
               [2,W("me gusta|gusta|s[ií]|bastante|bueno|dale")]];
  for(const [v,re] of rules) if(re.test(t)) return SCALE.find(s=>s.v===v);
  return null;
}

}

function leaves(n,animate){
  const g=$("#leaves"); const cur=g.childElementCount; if(n===cur)return;
  g.innerHTML="";
  const spots=[[204,80,1],[201,96,-1],[203,88,1],[200,104,-1],[202,92,1],[199,100,-1],[204,84,-1]];
  for(let i=0;i<Math.min(n,spots.length);i++){const [x,y,s]=spots[i];const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    const sz=12+i*1.5;p.setAttribute("d",`M${x} ${y} q${s*sz} ${-sz*.9} ${s*sz*1.9} ${-sz*.3} q${-s*sz*.8} ${sz} ${-s*sz*1.9} ${sz*.3}z`);
    p.setAttribute("fill",i%2?"var(--leaf2)":"var(--leaf)");p.setAttribute("stroke","#2A2433");p.setAttribute("stroke-width","2.5");
    if(animate&&i===n-1)p.classList.add("grow"); g.appendChild(p);}
}

function item(i){
  if(i>=ITEMS.length) return askValores();
  const [t,txt]=ITEMS[i];
  progress(.15+.7*(i/ITEMS.length),`${i+1} de ${ITEMS.length}`);
  leaves(2+Math.floor(i/6), i%6===0 && i>0);
  const pre = i===0 ? "Primera: ¿te gustaría " : i===ITEMS.length-1 ? "Última: ¿te gustaría " : "¿Te gustaría ";
  say(pre+txt.charAt(0).toLowerCase()+txt.slice(1)+"?");
  P.innerHTML=`<div class="qnum">${i+1} de ${ITEMS.length}</div>
    <p class="q">¿Te gustaría ${txt.charAt(0).toLowerCase()+txt.slice(1)}?</p>
    <div class="scale">${SCALE.map(s=>`<button class="opt" data-v="${s.v}" aria-pressed="${S.answers[i]===s.v}"><span class="dot">${s.e}</span>${s.t}</button>`).join("")}</div>
    ${micButton()}
    ${i>0?`<button class="link" id="back">← Volver a la anterior</button>`:""}`;
  const answer=v=>{
    S.answers[i]=v; S.answers.length=i+1; save(); hop();
    const next=()=>item(i+1);
    const run=S.answers.slice(-8);
    if(!S.avisoIgual && run.length===8 && run.every(x=>x===v)){
      S.avisoIgual=true; save();
      say(v===1 ? `${S.name}, veo que a todo le respondés "me da igual". Probá cerrar los ojos un segundo e imaginarte haciéndolo de verdad: ¿te divertiría o te aburriría?`
        : v===0 ? `${S.name}, veo que nada de esto te gusta, ¡y está bien! Igual probá imaginarte haciéndolo un ratito antes de responder.`
        : `¡Te gusta todo, ${S.name}! Para que el resultado te sirva, probá separar lo que te encanta de lo que solo te gusta.`);
      setTimeout(next,4200); return;
    }
    if(i===Math.floor(ITEMS.length/2)-1){ say(`¡Vamos por la mitad, ${S.name}! Lo estás haciendo re bien.`); setTimeout(next,2200); }
    else if(Math.random()<.3){ say(pick(REACT[v])); setTimeout(next,1100); }

function scores(){
  const sc={R:0,I:0,A:0,S:0,E:0,C:0};
  ITEMS.forEach(([t],i)=>{ sc[t]+=S.answers[i]||0; });
  const max=ITEMS.filter(([t])=>t==="R").length*3;
  return Object.entries(sc).map(([k,v])=>({k,v,p:Math.round(v/max*100)})).sort((a,b)=>b.v-a.v);
}

    <div class="bars">${sc.map(t=>`<div class="brow"><span>${TYPES[t.k].n}</span><div class="track"><div class="fill" style="background:${TYPES[t.k].c}" data-w="${t.p}"></div></div><span>${t.p}%</span></div>`).join("")}</div>

function sortCars(k){
  const pref = S.dur && S.dur!=="x" ? S.dur : (S.plan==="trabajar" ? "c" : S.plan==="ambas" ? "t" : null);
  const order = pref ? [pref, ...["c","t","u"].filter(x=>x!==pref)] : ["t","u","c"];
  return [...TYPES[k].car].sort((x,y)=>order.indexOf(x[1])-order.indexOf(y[1]));
}
function carList(k,n){ return `<div class="tags">${sortCars(k).slice(0,n).map(([c,l])=>`<span class="tag">${c}<small>${NIVEL[l]}</small></span>`).join("")}</div>`; }
function hobbyTxt(sc){
  const hs=(S.hobbies||[]); if(!hs.length) return "";
  const cnt={R:0,I:0,A:0,S:0,E:0,C:0};
  hs.forEach(h=>{ const m=HOBBIES.find(x=>x[0]===h); if(m) [...m[1]].forEach(k=>cnt[k]++); });
  const hk=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const top3=sc.slice(0,3).map(t=>t.k);
  return top3.includes(hk)
    ? `Lo que hacés en tu tiempo libre (${listar(hs.map(h=>h.toLowerCase()))}) coincide con tu lado <b>${TYPES[hk].n.toLowerCase()}</b>. Cuando algo te gusta tanto que lo hacés sin que te lo pidan, es una pista fuerte.`
    : `En tu tiempo libre aparece un lado <b>${TYPES[hk].n.toLowerCase()}</b> (${TYPES[hk].short.toLowerCase()}) que en el test salió más bajo. No lo descartes: a veces lo que hacemos por gusto también puede ser un camino.`;
}
function caminoTxt(){
  const p={estudiar:"Querés seguir estudiando",trabajar:"Querés salir a trabajar",ambas:"Querés estudiar y trabajar a la vez",nose:"Todavía no sabés si estudiar o trabajar, y está perfecto"}[S.plan]||"";
  const d={c:"Por eso te mostramos primero cursos y oficios cortos, que te permiten empezar a trabajar rápido.",
           t:"Por eso te mostramos primero terciarios y tecnicaturas: son más cortos que la universidad y tienen buena salida laboral.",
           u:"Por eso te mostramos primero carreras universitarias, sin dejar de lado opciones más cortas para ir probando.",
           x:"Te mostramos opciones de distintos largos para que compares."}[S.dur]||"";
  const l={cerca:"Como preferís quedarte en tu zona, averiguá qué institutos, universidades y centros de formación profesional hay cerca: muchas de estas opciones se dictan en ciudades chicas.",
           mudar:"Como te podrías mudar, se te abren más opciones: compará planes de estudio de distintas ciudades y fijate si hay residencias o becas.",
           virtual:"Como preferís estudiar a distancia, buscá la modalidad virtual: muchas tecnicaturas y carreras ya se pueden hacer así.",
           x:"Pensar dónde te gustaría estar también ayuda a decidir: hacelo con calma."}[S.lugar]||"";
  return `${p}. ${d} ${l}`.trim();
}
function esc(x){ return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sinDiferencias(sc){
  const v=S.answers; const allSame=v.every(x=>x===v[0]);
  return allSame || (sc[0].p - sc[5].p) <= 10 || sc[0].p < 25;
}
function reportSinPerfil(sc){
  const v=S.answers, avg=v.reduce((a,b)=>a+b,0)/v.length;
  const modo = avg<=0.6 ? "bajo" : avg>=2.4 ? "alto" : "parejo";
  const txt={
    bajo:{t:"Todavía no apareció lo tuyo",
          p:"Respondiste que casi nada de esto te gusta. No pasa nada: puede que estas actividades no te representen, que hoy no sea un buen día, o que lo que te apasiona todavía no lo hayas probado.",
          v:`${S.name}, parece que nada de esto te movió mucho. Está perfecto, no tenés que tenerla clara hoy. Lo importante es seguir probando cosas hasta que algo te haga brillar los ojos.`},
    parejo:{t:"Tus respuestas salieron muy parejas",
          p:"Respondiste casi todo igual, así que no puedo saber qué te tira más. Suele pasar cuando se contesta rápido, cuando hay cansancio, o cuando cuesta imaginarse haciendo esas cosas.",
          v:`${S.name}, tus respuestas salieron muy parejas y así no te puedo decir qué te tira más. ¿Probamos de nuevo con calma? Imaginate de verdad haciendo cada cosa.`},
    alto:{t:"¡Te gusta todo!",
          p:"Te entusiasman casi todas las actividades. ¡Es una gran noticia! Pero para orientarte necesito saber qué es lo que más te gusta, no solo lo que te gusta.",
          v:`¡${S.name}, te gusta todo! Eso es hermoso. Para ayudarte mejor, probá hacer el test de nuevo separando lo que te encanta de lo que solo te gusta.`}
  }[modo];
  // pistas desde el tiempo libre y las materias
  const cnt={R:0,I:0,A:0,S:0,E:0,C:0};
  (S.hobbies||[]).forEach(h=>{ const m=HOBBIES.find(x=>x[0]===h); if(m) [...m[1]].forEach(k=>cnt[k]++); });
  const pist=Object.keys(cnt).filter(k=>cnt[k]>0).sort((a,b)=>cnt[b]-cnt[a]).slice(0,2);
  P.innerHTML=`<h1>${txt.t}</h1>
    <p class="sub">${esc(S.name)} · ${S.edad} años</p>
    <div class="sec"><h3>Qué pasó</h3><p>${txt.p}</p><p>Por eso esta vez <b>no te muestro un perfil</b>: sería inventarlo, y no te serviría.</p></div>
    ${pist.length?`<div class="sec"><h3>Una pista de lo que me contaste</h3>
      <p>En tu tiempo libre te gusta ${listar((S.hobbies||[]).map(h=>h.toLowerCase()))}. Eso se acerca a un lado <b>${pist.map(k=>TYPES[k].n.toLowerCase()).join("</b> y <b>")}</b>.</p>
      ${pist.map(k=>`<p style="margin-top:10px"><b>${TYPES[k].short}:</b></p>${carList(k,4)}`).join("")}</div>`:""}
    <div class="sec"><h3>Qué podés hacer</h3>
      <p>1. Hacé el test otro día, con tiempo y sin apuro.</p>
      <p>2. Antes de responder cada pregunta, imaginate haciendo eso un día entero.</p>
      <p>3. Probá actividades nuevas: un taller, un curso corto, ayudar a alguien en su trabajo.</p>
      <p>4. Charlá con un orientador vocacional o con el gabinete de tu escuela: te pueden ayudar a encontrar lo tuyo.</p>
    </div>
    <div class="warn">Este test es una orientación, no un diagnóstico. Que no haya salido un perfil no dice nada malo de vos.</div>
    <div class="actions">
      <button class="btn" id="redo">Responder las 30 preguntas de nuevo</button>
      <button class="ghost" id="again">Empezar un test nuevo (otra persona)</button>
    </div>`;
  say(txt.v);
  $("#redo").onclick=()=>{ shutUp(); S={...S,answers:[],valores:[],avisoIgual:false}; save(); window.scrollTo(0,0); introTest(); };
  $("#again").onclick=()=>{ shutUp(); S=BLANK(); save(); window.scrollTo(0,0); askName(); };
}
function listar(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" y "+a[a.length-1]; }
function matchMaterias(k){
  const m={R:["Informática o Taller","Física o Química","Educación Física"],I:["Matemática","Biología","Física o Química","Informática o Taller"],A:["Arte o Música","Lengua"],S:["Lengua","Historia o Geografía","Educación Física"],E:["Historia o Geografía","Lengua","Inglés"],C:["Matemática","Informática o Taller"]};
  return S.materias.some(x=>m[k].includes(x));
}
function valorTxt(v){
  const t={ "Ayudar a los demás":"buscá carreras donde tu trabajo le cambie el día a alguien",
    "Ganar bien":"mirá también la salida laboral y la demanda de cada carrera en tu zona",
    "Tener estabilidad":"te pueden servir caminos con empleo formal o en relación de dependencia",
    "Crear cosas nuevas":"te conviene un trabajo donde puedas proponer y no solo repetir",
    "Libertad de horarios":"pensá en profesiones independientes o en emprender",
    "Contacto con la naturaleza":"fijate en carreras que se trabajan afuera, no solo en oficina",
    "Aprender siempre":"vas a disfrutar áreas que cambian rápido y te obligan a actualizarte",
    "Que me reconozcan":"buscá lugares donde tu trabajo se vea y se valore" };
  return "Eso quiere decir que "+v.map(x=>t[x]).join(", y además ")+".";
}
